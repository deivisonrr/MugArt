<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MugArt — Compre 4 canecas personalizadas e ganhe a 5ª grátis. Fale pelo WhatsApp ou vá para a loja.">
  <title>MugArt | Compre 4, Ganhe a 5ª Grátis</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; }
    body { font-family: Arial, Helvetica, sans-serif; }
    .lp {
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      position: relative;
      line-height: 0;
    }
    .lp img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }
    .hotspot {
      position: absolute;
      display: block;
      z-index: 5;
      border-radius: 12px;
      line-height: normal;
      outline: none;
    }
    .hotspot:focus-visible {
      outline: 3px solid #08bde7;
      outline-offset: 3px;
    }
    /*
      Coordinates are based on the approved 1024 x 1536 artwork.
      They scale automatically with the image/container.
    */
    .whatsapp-hero {
      left: 4.1%;
      top: 33.75%;
      width: 31.2%;
      height: 4.45%;
    }
    .store-hero {
      left: 4.1%;
      top: 38.45%;
      width: 31.2%;
      height: 4.45%;
    }
    .store-final {
      left: 59.5%;
      top: 85.8%;
      width: 32%;
      height: 4.0%;
    }
    .whatsapp-final {
      left: 4.1%;
      top: 33.75%;
      width: 31.2%;
      height: 4.45%;
    }

    .floating-whatsapp {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 20;
      min-width: 62px;
      height: 62px;
      padding: 0 18px;
      border-radius: 999px;
      background: #11bd63;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      text-decoration: none;
      box-shadow: 0 7px 22px rgba(0,0,0,.24);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .floating-whatsapp:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 27px rgba(0,0,0,.28);
    }
    .wa-symbol {
      width: 31px;
      height: 31px;
      border: 3px solid #fff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 21px;
      font-weight: 900;
      transform: rotate(-35deg);
    }
    .wa-label { white-space: nowrap; }

    @media (max-width: 600px) {
      .floating-whatsapp {
        right: 16px;
        bottom: 16px;
        width: 58px;
        min-width: 58px;
        height: 58px;
        padding: 0;
      }
      .wa-label { display: none; }
      .wa-symbol {
        width: 30px;
        height: 30px;
      }
    }

    @media (max-width: 600px) {
      .hotspot { border-radius: 8px; }
    }
    .accessibility-text {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="lp" aria-label="Promoção MugArt — compre 4, ganhe a 5ª grátis">
    <img
      src="./assets/landing-page-promocao.png"
      alt="Promoção MugArt: comprou 4 canecas, ganhou a 5ª grátis. Personalize suas canecas e aproveite a promoção."
    >

    <!-- Botões transparentes sobre a arte aprovada -->
    <a
      class="hotspot whatsapp-hero"
      href="https://wa.me/5511988849236?text=Ol%C3%A1!%20Vim%20pela%20promo%C3%A7%C3%A3o%20da%20MugArt.%20Quero%20comprar%204%20canecas%20e%20ganhar%20a%205%C2%AA%20gr%C3%A1tis."
      target="_blank"
      rel="noopener"
      aria-label="Falar com a MugArt pelo WhatsApp"
      data-event="promocao_whatsapp_click"
    ><span class="accessibility-text">Falar no WhatsApp</span></a>

    <a
      class="hotspot store-hero"
      href="https://mugart.com.br/loja"
      aria-label="Ir para a loja MugArt"
      data-event="promocao_loja_click"
    ><span class="accessibility-text">Ir para a loja</span></a>

    <a
      class="hotspot store-final"
      href="https://mugart.com.br/"
      aria-label="Quero minhas canecas — ir para a loja MugArt"
      data-event="promocao_loja_final_click"
    ><span class="accessibility-text">Quero minhas canecas</span></a>
  </main>


  <a
    class="floating-whatsapp"
    href="https://wa.me/5511988849236?text=Ol%C3%A1!%20Vim%20pela%20promo%C3%A7%C3%A3o%20da%20MugArt.%20Quero%20comprar%204%20canecas%20e%20ganhar%20a%205%C2%AA%20gr%C3%A1tis."
    target="_blank"
    rel="noopener"
    aria-label="Falar com a MugArt pelo WhatsApp"
    data-event="promocao_whatsapp_floating"
  >
    <span class="wa-symbol" aria-hidden="true">◔</span>
    <span class="wa-label">Fale conosco</span>
  </a>

  <script>
    window.dataLayer = window.dataLayer || [];
    document.querySelectorAll("[data-event]").forEach(function (link) {
      link.addEventListener("click", function () {
        window.dataLayer.push({
          event: link.dataset.event,
          campaign: "compre4_ganhe5",
          destination: link.href
        });
      });
    });
  </script>
</body>
</html>
